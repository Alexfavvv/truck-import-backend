openapi: 3.0.0
info:
  title: Truck Import API
  version: 1.0.0
  description: API для работы с брендами, моделями грузовиков, типами запчастей и продуктами.

servers:
  - url: http://127.0.0.1:8000/api/v1/client
    description: Local development server
  - url: http://localhost/api/v1/client
    description: Local sail development server
  - url: https://truck-import.laravel.cloud/api/v1/client
    description: Test development server

paths:
  /brands:
    get:
      tags:
        - Brands
      summary: Получить список всех брендов
      operationId: listBrands
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BrandResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /brands/{brand}:
    get:
      tags:
        - Brands
      summary: Получить информацию о конкретном бренде
      operationId: showBrand
      parameters:
        - name: brand
          in: path
          required: true
          schema:
            type: string
          description: Slug уникальный идентификатор бренда
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandResponse'
        '404':
          description: Бренд не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trucks/{truckModel}:
    get:
      tags:
        - Truck Models
      summary: Получить информацию о конкретной модели грузовика
      operationId: showTruckModel
      parameters:
        - name: truckModel
          in: path
          required: true
          schema:
            type: string
          description: Slug уникальный идентификатор модели грузовика
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TruckModelResponse'
        '404':
          description: Модель грузовика не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products:
    get:
      tags:
        - Products
      summary: Получить список всех продуктов
      operationId: listProducts
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductShort'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/{product}:
    get:
      tags:
        - Products
      summary: Получить информацию о конкретном продукте по SKU
      operationId: showProduct
      parameters:
        - name: product
          in: path
          required: true
          schema:
            type: string
          description: SKU уникальный идентификатор продукта
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Продукт не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    # Основные схемы ответов
    BrandResponse:
      type: object
      allOf:
        - type: object
          properties:
            slug:
              type: string
              example: "brand-slug"
            title:
              type: string
              example: "Example Brand"
            description:
              type: string
              nullable: true
              example: "Description of the example brand."
            image_url:
              type: string
              format: uri
              nullable: true
              example: "https://via.placeholder.com/640x480.png/003333?text=brand_image"
            part_types:
              type: array
              items:
                $ref: '#/components/schemas/PartType'
            metatags:
              $ref: '#/components/schemas/Metatags'
        - $ref: '#/components/schemas/BrandContent'

    # Новая схема для поля content
    BrandContent:
      type: object
      properties:
        subcat__title:
          type: string
          nullable: true
          example: "Заголовок подкатегории"
        first__place:
          type: array
          items:
            type: array
            items:
              type: string
            example: ["Заголовок 1", "<p>Контент 1</p>"]
        second__place:
          type: array
          items:
            type: array
            items:
              type: string
            example: ["Заголовок 2", "<p>Контент 2</p>"]
        faq__title:
          type: string
          nullable: true
          example: "Заголовок FAQ"
        faq__data:
          type: array
          items:
            $ref: '#/components/schemas/FaqItem'

    # Обновленная схема для TruckModelResponse
    TruckModelResponse:
      type: object
      allOf:
        - type: object
          properties:
            id:
              type: integer
              example: 24
            brand_id:
              type: integer
              example: 1
            slug:
              type: string
              example: "model-slug"
            title:
              type: string
              example: "Example Truck Model"
            description:
              type: string
              nullable: true
              example: "Description of the truck model."
            image_url:
              type: string
              format: uri
              nullable: true
              example: "https://via.placeholder.com/640x480.png/000099?text=model_image"
            metatags:
              $ref: '#/components/schemas/Metatags'
        - $ref: '#/components/schemas/TruckModelContent'

    # Новая схема для контента TruckModel
    TruckModelContent:
      type: object
      properties:
        faq__title:
          type: string
          nullable: true
          example: "Заголовок для FAQ"
        faq__data:
          type: array
          items:
            $ref: '#/components/schemas/FaqItem'
        first__place:
          type: array
          items:
            type: array
            items:
              type: string
            example: ["Заголовок 1", "<p>HTML-контент 1</p>"]
        second__place:
          type: array
          items:
            type: array
            items:
              type: string
            example: ["Заголовок 2", "<p>HTML-контент 2</p>"]

    FaqItem:
      type: array
      items:
        type: string
      example: ["Вопрос", "<p>Ответ</p>"]

    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          example: 42
        brand_id:
          type: integer
          example: 3
        part_type_id:
          type: integer
          example: 26
        sku:
          type: string
          example: "PROD-SKU-12345"
        title:
          type: string
          example: "Product Title Example"
        description:
          type: string
          nullable: true
          example: "Detailed description of the product."
        price:
          type: number
          format: float
          example: 123.45
        delivery:
          type: string
          nullable: true
          example: "3-5 business days"
        quantity:
          type: integer
          example: 10
        image_url:
          type: string
          format: uri
          nullable: true
          example: "http://127.0.0.1:8000/storage/images/product_image.png"
        truck_manufacturers:
          type: array
          items:
            $ref: '#/components/schemas/TruckManufacturer'
        metatags:
          $ref: "#/components/schemas/Metatags"
        characteristics:
          type: array
          items:
            $ref: '#/components/schemas/Characteristic'

    # Вспомогательные схемы
    PartType:
      type: object
      properties:
        title:
          type: string
          example: "consequatur est"
        slug:
          type: string
          example: "consequatur-est"

    Characteristic:
      type: object
      properties:
        title:
          type: string
          example: "Color"
        description:
          type: string
          example: "Red"

    Metatags:
      type: object
      properties:
        meta_h1:
          type: string
          nullable: true
          example: "Product Page H1"
        meta_title:
          type: string
          nullable: true
          example: "Product Meta Title"
        meta_description:
          type: string
          nullable: true
          example: "Product meta description for SEO."

    TruckManufacturer:
      type: object
      properties:
        id:
          type: integer
          example: 1
        slug:
          type: string
          example: "manufacturer-slug"

    ProductShort:
      type: object
      properties:
        sku:
          type: string
          example: "80"
        title:
          type: string
          example: "Miss"
        price:
          type: number
          format: float
          example: 10.50
        quantity:
          type: integer
          example: 380
        image_url:
          type: string
          format: uri
          nullable: true
          example: "https://via.placeholder.com/640x480.png/002244?text=product_short_image"

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: "Resource not found"
        code:
          type: integer
          example: 404
